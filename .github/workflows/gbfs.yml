name: Zrzut GBFS Metrorower
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: gbfs
  cancel-in-progress: false
jobs:
  zrzut:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Zrzut stanu stacji
        run: python3 gbfs_logger.py --out dane --layout snapshot
      - name: Zapis do repozytorium
        run: |
          git config user.name "gbfs-bot"
          git config user.email "gbfs-bot@users.noreply.github.com"
          git add dane
          git diff --cached --quiet && exit 0
          git commit -m "Zrzut $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
